<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TaskFlow · Python + Flask</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="app"><div class="eyebrow">Projeto em PYTHON e FLASK</div><h1>Task<span>Flow.</span></h1><p class="intro">Organize suas ideias, uma tarefa de cada vez.</p><form id="form"><input id="title" maxlength="120" required placeholder="O que você precisa fazer?" aria-label="Nova tarefa"><button type="submit">+ Adicionar</button></form><div class="toolbar"><strong id="count">Carregando...</strong><div class="filters"><button data-filter="all" class="active">Todas</button><button data-filter="pending">Pendentes</button><button data-filter="done">Concluídas</button></div></div><ul id="list"></ul><p id="message" role="status"></p><footer>Desenvolvido por Thiago Chui</footer></main><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
